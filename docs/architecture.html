  <p class="eyebrow">EVIDENCEHIRE · PS02 · X'O CODE 2026</p>
  <h1>System Architecture</h1>
  <p class="sub">The console loads a requisition and applications, three parsers read them,
  and the evidence grader decides how well-supported every claim actually is before anything
  downstream trusts it.</p>
</header>
