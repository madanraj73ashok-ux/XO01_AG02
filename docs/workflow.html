<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EvidenceHire — Screening Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --accent:#eb6c36;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Geist',sans-serif;color:var(--ink);}
  header{padding:32px 40px 8px;}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:8px;letter-spacing:0.18em;
           text-transform:uppercase;color:var(--soft);margin:0 0 8px;}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:1.75rem;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 16px;max-width:680px;}
  .wrap{padding:0 24px 24px;}
  svg{width:100%;height:auto;display:block;}
</style>
</head>
<body>
<header>
  <p class="eyebrow">EVIDENCEHIRE · PS02 · X'O CODE 2026</p>
  <h1>Screening Workflow</h1>
  <p class="sub">Eight stages from raw application to human decision. Grading sits at the
  centre: nothing downstream is allowed to treat a claim as proven until the evidence
  behind it has been placed on the ladder.</p>
</header>
<div class="wrap">
<svg viewBox="0 0 960 512" role="img" aria-labelledby="eh-flow-title eh-flow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="eh-flow-title">EvidenceHire screening workflow</title>
<desc id="eh-flow-desc">An eight-stage pipeline running left to right then back: application intake, requisition analysis with conflict detection, claim extraction, terminology matching, then evidence grading on the E0 to E4 ladder, requirement assessment, trade-off and pool-gap analysis, ending at a human hiring decision.</desc>

<rect width="960" height="512" fill="#f5f5f5"/>

<defs>
  <marker id="wf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="wf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
  </marker>
</defs>

<!-- ============ arrows (before boxes) ============ -->

<path d="M460,140 H492" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wf-arrow)"/>
<path d="M700,140 H732" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#wf-arrow-accent)"/>

<path d="M840,180 V292" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#wf-arrow-accent)"/>

<path d="M740,340 H708" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wf-arrow)"/>
<path d="M500,340 H468" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wf-arrow)"/>
<path d="M260,340 H228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#wf-arrow)"/>

<text x="840" y="340" fill="#2d3142" font-size="12" font-weight="600"

<text x="600" y="356" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace"

<text x="600" y="368" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace"

<rect x="260" y="300" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="260" y="300" width="200" height="80" rx="6" fill="rgba(45,49,66,0.02)"

<rect x="268" y="308" width="16" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
<text x="276" y="317" fill="rgba(45,49,66,0.5)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
<text x="360" y="340" fill="#4f5d75" font-size="12" font-weight="600"

<text x="360" y="356" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace"

<rect x="20" y="300" width="200" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
